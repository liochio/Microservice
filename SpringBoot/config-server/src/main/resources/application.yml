server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/shared-configs
          default-label: main
  security:
    user:
      name: ${CONFIG_SERVER_USERNAME:configadmin}
      password: ${CONFIG_SERVER_PASSWORD:configsecret123}

encrypt:
  key: ${ENCRYPT_KEY:liochio-config-server-enterprise-cipher-key-2026}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: "health,info,refresh,env,configprops,encrypt,decrypt"
  endpoint:
    health:
      show-details: always
    encrypt:
      enabled: true
    decrypt:
      enabled: true