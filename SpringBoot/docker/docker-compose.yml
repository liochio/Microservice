# ==============================================================================
# Docker Compose - Portfolio Backend Engine Infrastructure Stack
# Cung cấp toàn bộ hạ tầng cơ sở dữ liệu, caching, message queue, email testing
# ==============================================================================
version: '3.8'

services:
  # 1. MySQL 8.0 Database Server
  mysql:
    image: mysql:8.0.36
    container_name: portfolio-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "your_password"
      MYSQL_DATABASE: "portfolio-engine"
      TZ: "UTC"
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
      - --max_connections=1000
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init-mysql.sql:/docker-entrypoint-initdb.d/init-mysql.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p12345678"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis 7 (L2 Cache, Distributed Lock ShedLock, Token Blacklist)
  redis:
    image: redis:7.2-alpine
    container_name: portfolio-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. RabbitMQ Message Broker (Outbox Pattern & Event Relay)
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: portfolio-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "guest"
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # RabbitMQ Management Web UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # 4. Mailpit (Mock SMTP Server cho Notification Service testing)
  mailpit:
    image: axllent/mailpit:latest
    container_name: portfolio-mailpit
    restart: always
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI xem email test
    environment:
      MP_MAX_MESSAGES: 500

  # 5. Zipkin Distributed Tracing (Micrometer Tracing)
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: portfolio-zipkin
    restart: always
    ports:
      - "9411:9411"

  # 6. Adminer (Web UI quản lý MySQL database trực quan)
  adminer:
    image: adminer:latest
    container_name: portfolio-adminer
    restart: always
    ports:
      - "8088:8080"
    depends_on:
      - mysql

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
