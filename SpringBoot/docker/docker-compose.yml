# ==============================================================================
# Docker Compose - Liochio FinTech Platform Infrastructure Stack
# Cung cấp hạ tầng cơ sở dữ liệu phân tán, caching, message queue, email testing
# ==============================================================================
version: '3.8'

services:
  # 1. MySQL 8.0 Database Server (Database-Per-Service)
  mysql:
    image: mysql:8.0.36
    container_name: liochio-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "your_password"
      TZ: "UTC"
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
      - --max_connections=1000
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init-mysql.sql:/docker-entrypoint-initdb.d/init-mysql.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p12345678"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis 7 (L2 Cache, Distributed Lock ShedLock, Token Blacklist)
  redis:
    image: redis:7.2-alpine
    container_name: liochio-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. RabbitMQ Message Broker (Outbox Pattern & Event Relay)
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: liochio-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "guest"
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # RabbitMQ Management Web UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. Mailpit (Mock SMTP Testing Server)
  mailpit:
    image: axllent/mailpit:v1.18
    container_name: liochio-mailpit
    restart: always
    ports:
      - "1025:1025" # SMTP Port
      - "8025:8025" # Web UI Port

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
