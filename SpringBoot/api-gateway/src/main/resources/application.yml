server:
  port: 8080

spring:
  application:
    name: api-gateway
    data:
      redis:
        host: ${REDIS_HOST:localhost}
        port: ${REDIS_PORT:6379}
        timeout: 2000ms
  cloud:
    gateway:
      httpclient:
        connect-timeout: 3000
        response-timeout: 5s
        pool:
          type: ELASTIC
          max-idle-time: 15s
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # 1. Auth & Pure IAM Service Routes (Port 8081)
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**, /api/v1/roles/**, /api/v1/tenants/**, /api/v1/approvals/**, /api/v1/onboarding/**, /api/v1/security/**, /api/auth/**, /api/users/**, /api/roles/**, /api/tenants/**, /api/approvals/**, /api/onboarding/**, /api/security/**

        # 2. Core Banking Double-Entry Ledger Service Routes (Port 8085)
        - id: ledger-service
          uri: ${LEDGER_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/ledger/**, /api/ledger/**

        # 3. Payment Service Routes (Port 8083)
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/payments/**, /api/v1/bookings/**, /api/v1/wallets/**, /api/v1/transactions/**, /api/payments/**, /api/bookings/**, /api/wallets/**, /api/transactions/**

        # 4. Python IoT & AI Satellite Extension (Port 8000 - Tenant A: PiggyBank / AI)
        - id: python-iot-ai-service
          uri: ${FINTECH_URL:http://localhost:8000}
          predicates:
            - Path=/api/v1/iot/**, /api/v1/smart-piggy/**, /api/v1/smart_piggy/**, /api/v1/ocr/**, /api/v1/ai/**, /api/v1/budgets/**, /api/v1/goals/**, /api/v1/transfers/**, /api/v1/reports/**, /api/v1/ws/**

        # 5. Enterprise Notification Service Routes (Port 8084)
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/notifications/**, /api/notifications/**

        # 6. Entity, Master Data, Dynamic Menus & Config Matrix Routes (Port 8082)
        - id: entity-service
          uri: ${ENTITY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/entities/**, /api/v1/master-data/**, /api/v1/portfolios/**, /api/v1/ui-configs/**, /api/v1/forms/**, /api/v1/system/**, /api/v1/system-configs/**, /api/v1/menus/**, /api/v1/configs/**, /api/v1/corp/configs/**, /api/entities/**, /api/master-data/**, /api/portfolios/**, /api/ui-configs/**, /api/forms/**, /api/system/**, /api/system-configs/**, /api/menus/**, /api/configs/**, /api/corp/configs/**

        # 6. AI Service (Port 8086)
        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/api/v1/ai/**, /api/ai/**

        # 7. Realtime WebSocket Gateway (Port 8087)
        - id: realtime-service
          uri: lb:ws://realtime-service
          predicates:
            - Path=/ws/**, /ws-notification/**

        # 11. Dedicated OTP & SmartOTP Service (Port 8094)
        - id: otp-service
          uri: ${OTP_SERVICE_URL:http://localhost:8094}
          predicates:
            - Path=/api/v1/otp/**, /api/otp/**

        # 12. Central Worker & Audit Service (Port 8095)
        - id: worker-service
          uri: ${WORKER_SERVICE_URL:http://localhost:8095}
          predicates:
            - Path=/api/v1/worker/**, /api/worker/**

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
    register-with-eureka: true
    fetch-registry: true

jwt:
  secret: ${JWT_SECRET:liochio-super-secret-jwt-key-minimum-256-bits-for-security-2026}
  rsa:
    public-key-path: ${JWT_RSA_PUBLIC_KEY:classpath:certs/rsa-public.pem}

security:
  cloudflare:
    strict-origin-enabled: ${STRICT_ORIGIN_ENABLED:false}
    whitelist-cidrs:
      - "173.245.48.0/20"
      - "103.21.244.0/22"
      - "103.22.200.0/22"
      - "103.31.4.0/22"
      - "141.101.64.0/18"
      - "108.162.192.0/18"
      - "190.93.240.0/20"
      - "188.114.96.0/20"
      - "197.234.240.0/22"
      - "198.41.128.0/17"
      - "162.158.0.0/15"
      - "104.16.0.0/13"
      - "104.24.0.0/14"
