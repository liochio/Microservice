worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # 👑 OBSERVABILITY LAYER: Kế thừa Trace ID hoặc tự sinh mới - Dùng nháy đơn chuẩn chỉ
    map $http_x_trace_id $trace_id {
        default '$request_id';
        ~.+     $http_x_trace_id;
    }

    log_format fintech_enterprise_gateway '[$time_local] IP: $remote_addr | Trace-ID: $trace_id | '
                                          'Status: $status | Method: $request_method | URI: $request_uri | '
                                          'Latency: ${request_time}s';

        access_log /var/log/nginx/gateway_access.log fintech_enterprise_gateway;

    upstream fastapi_core_upstream {
        server 127.0.0.1:8000; # Đóng đinh cổng FastAPI Presentation Layer hệ thống
    }

    server {
        listen 80;
        server_name localhost;

        # 👑 SECURITY HARDENING: Tuyệt đối dùng nháy đơn để bọc chuỗi tham số có modifier
        add_header X-Frame-Options 'DENY' always;
        add_header X-Content-Type-Options 'nosniff' always;
        add_header X-XSS-Protection '1; mode=block' always;
        add_header Content-Security-Policy 'default-src self; frame-ancestors none;' always;
        add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains' always;

        location / {
            # proxy_set_header viết trần biến hệ thống, không bọc nháy rác
            proxy_set_header X-Trace-ID $trace_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;

            proxy_pass http://fastapi_core_upstream;
            proxy_redirect off;
        }
    }
}