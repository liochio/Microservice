# ==============================================================================
# 👑 REVERSE PROXY & API GATEWAY CONFIGURATION
# Định tuyến Microservices FinTech Platform:
# - Java IAM IdP (liochio-core): Port 8081
# - Python Resource Server (liochio-fintech): Port 8000
# ==============================================================================

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Cụm upstream dịch vụ IAM Core (Java)
    upstream java_iam_core {
        server 127.0.0.1:8081;
        keepalive 32;
    }

    # Cụm upstream dịch vụ Standalone OTP & SmartOTP (Java)
    upstream java_otp_service {
        server 127.0.0.1:8094;
        keepalive 32;
    }

    # Cụm upstream dịch vụ FinTech Resource Server (Python)
    upstream python_fintech_server {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    server {
        listen       80;
        server_name  localhost;

        # Header chuẩn cho toàn bộ Proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 1. Định tuyến các Endpoint IAM: Đăng ký, Đăng nhập, JWKS về Java Core
        location ~ ^/(api/v1/auth|\.well-known) {
            proxy_pass http://java_iam_core;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # 2. Định tuyến Standalone OTP & SmartOTP Service tập trung
        location ~ ^/(api/v1/otp|api/otp) {
            proxy_pass http://java_otp_service;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # 2. Định tuyến Swagger UI & Actuator của Java Core
        location ~ ^/(swagger-ui|v3/api-docs|actuator) {
            proxy_pass http://java_iam_core;
        }

        # 3. Định tuyến kênh WebSocket Realtime về Python Service
        location /ws {
            proxy_pass http://python_fintech_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 4. Định tuyến toàn bộ API nghiệp vụ FinTech (Wallets, Transactions, Goals, Piggy, Reports...) về Python Service
        location /api/v1 {
            proxy_pass http://python_fintech_server;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # 5. Fallback Root
        location / {
            return 200 '{"status":"ONLINE","message":"Liochio FinTech API Gateway is running."}';
            add_header Content-Type application/json;
        }
    }
}
